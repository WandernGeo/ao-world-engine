<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RE:ECHO City - Simulation Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            color: #00CED1;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        #container {
            display: flex;
            height: 100vh;
        }

        #sidebar {
            width: 280px;
            background: #12121a;
            border-right: 1px solid #00CED1;
            padding: 15px;
            overflow-y: auto;
        }

        #canvas-container {
            flex: 1;
            position: relative;
        }

        canvas {
            display: block;
        }

        h1 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #00CED1;
            text-shadow: 0 0 10px #00CED1;
        }

        h2 {
            font-size: 12px;
            margin: 15px 0 10px 0;
            color: #888;
            text-transform: uppercase;
        }

        .control-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 11px;
            margin-bottom: 5px;
            color: #666;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #00CED1;
        }

        .tick-display {
            font-size: 24px;
            text-align: center;
            padding: 10px;
            background: #1a1a25;
            border: 1px solid #00CED1;
            margin-bottom: 15px;
        }

        .time-display {
            font-size: 12px;
            color: #888;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 8px;
            margin: 3px 0;
            background: #1a1a25;
            border: 1px solid #00CED1;
            color: #00CED1;
            cursor: pointer;
            font-family: inherit;
            font-size: 11px;
        }

        button:hover {
            background: #00CED1;
            color: #0a0a0f;
        }

        button.active {
            background: #00CED1;
            color: #0a0a0f;
        }

        .legend {
            margin-top: 15px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
            font-size: 11px;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .legend-square {
            width: 12px;
            height: 12px;
            margin-right: 8px;
        }

        #npc-list {
            max-height: 200px;
            overflow-y: auto;
            font-size: 10px;
        }

        .npc-item {
            padding: 5px;
            border-bottom: 1px solid #222;
            cursor: pointer;
        }

        .npc-item:hover {
            background: #1a1a25;
        }

        .npc-item.selected {
            background: #00CED1;
            color: #0a0a0f;
        }

        #tooltip {
            position: absolute;
            background: rgba(10, 10, 15, 0.95);
            border: 1px solid #00CED1;
            padding: 10px;
            font-size: 11px;
            pointer-events: none;
            display: none;
            max-width: 200px;
        }

        .zoom-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
        }

        .zoom-controls button {
            width: 40px;
            height: 40px;
            font-size: 20px;
        }
    </style>
</head>

<body>
    <div id="container">
        <div id="sidebar">
            <h1>🌃 RE:ECHO CITY</h1>
            <div class="tick-display">
                TICK: <span id="tick-value">0</span>
            </div>
            <div class="time-display">
                Day <span id="day-value">1</span> | <span id="time-period">T04</span> | <span
                    id="hour-value">12</span>:00
            </div>

            <div class="control-group">
                <label>Simulation Speed</label>
                <input type="range" id="speed" min="0" max="100" value="50">
                <div style="display: flex; gap: 5px; margin-top: 5px;">
                    <button id="play-btn" class="active">▶ Play</button>
                    <button id="pause-btn">⏸ Pause</button>
                    <button id="step-btn">⏭ Step</button>
                </div>
            </div>

            <h2>View Mode</h2>
            <div class="control-group">
                <button id="view-building" class="active">🏢 Building</button>
                <button id="view-district">🏘️ District</button>
                <button id="view-city">🌆 City</button>
            </div>

            <h2>Current Location</h2>
            <select id="location-select"
                style="width: 100%; padding: 5px; background: #1a1a25; color: #00CED1; border: 1px solid #00CED1;">
                <option value="neon_bar">Neon Bar</option>
                <option value="resistance_hideout">Resistance Hideout</option>
                <option value="market">Neon Market</option>
                <option value="temple_plaza">Temple Plaza</option>
                <option value="undercity">Undercity</option>
            </select>

            <h2>Show Layers</h2>
            <div class="control-group">
                <label><input type="checkbox" id="show-walls" checked> Walls & Structure</label>
                <label><input type="checkbox" id="show-furniture" checked> Furniture</label>
                <label><input type="checkbox" id="show-npcs" checked> NPCs</label>
                <label><input type="checkbox" id="show-objects" checked> Objects</label>
                <label><input type="checkbox" id="show-paths"> NPC Paths</label>
            </div>

            <h2>Legend</h2>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-dot" style="background: #00CED1;"></div> Player
                </div>
                <div class="legend-item">
                    <div class="legend-dot" style="background: #00FF00;"></div> Resistance
                </div>
                <div class="legend-item">
                    <div class="legend-dot" style="background: #FF4444;"></div> Temple Guard
                </div>
                <div class="legend-item">
                    <div class="legend-dot" style="background: #FFFF00;"></div> Civilian
                </div>
                <div class="legend-item">
                    <div class="legend-dot" style="background: #FF00FF;"></div> Merchant
                </div>
                <div class="legend-item">
                    <div class="legend-square" style="background: #333;"></div> Wall
                </div>
                <div class="legend-item">
                    <div class="legend-square" style="background: #553300;"></div> Furniture
                </div>
                <div class="legend-item">
                    <div class="legend-square" style="background: #004444;"></div> Tech
                </div>
            </div>

            <h2>NPCs in View (<span id="npc-count">0</span>)</h2>
            <div id="npc-list"></div>
        </div>

        <div id="canvas-container">
            <canvas id="canvas"></canvas>
            <div id="tooltip"></div>
            <div class="zoom-controls">
                <button id="zoom-in">+</button>
                <button id="zoom-out">−</button>
                <button id="zoom-reset">⌂</button>
            </div>
        </div>
    </div>

    <script>
        // =====================================================
        // SIMULATION DATA
        // =====================================================

        const LOCATIONS = {

                ],
                furniture: [
                    // Market stalls
                    { x: 3, y: 12, w: 5, h: 3, type: "stall" },
                    { x: 13, y: 12, w: 10, h: 3, type: "stall" },
                    { x: 28, y: 12, w: 10, h: 3, type: "stall" },

        // NPC definitions
        const NPCS = [
            { id: "charlie", name: "Charlie", faction: "resistance", color: "#00FF00", schedule: "resistance_fighter" },
            { id: "felix", name: "Felix", faction: "neutral", color: "#FF00FF", schedule: "shopkeeper" },
            { id: "zero_chen", name: "Zero Chen", faction: "resistance", color: "#00FF00", schedule: "resistance_fighter" },
            { id: "kira", name: "Kira", faction: "neutral", color: "#FFFF00", schedule: "oracle" },
            { id: "pixel", name: "Pixel", faction: "resistance", color: "#00FF00", schedule: "resistance_fighter" },
            { id: "guard_01", name: "Temple Guard", faction: "temple", color: "#FF4444", schedule: "temple_guard" },
            { id: "guard_02", name: "Temple Guard", faction: "temple", color: "#FF4444", schedule: "temple_guard" },
            { id: "civilian_01", name: "Worker", faction: "civilian", color: "#FFFF00", schedule: "worker" },
            { id: "civilian_02", name: "Vendor", faction: "civilian", color: "#FF00FF", schedule: "shopkeeper" },

        // Schedule mappings
        const SCHEDULES = {
            resistance_fighter: {
                T01: { location: "resistance_hideout", activity: "sleeping" },
                T02: { location: "resistance_hideout", activity: "training" },
                T03: { location: "market", activity: "intel" },
                T04: { location: "resistance_hideout", activity: "meeting" },
                T05: { location: "market", activity: "mission" },
                T06: { location: "market", activity: "mission" },
                T07: { location: "resistance_hideout", activity: "returning" },
                T08: { location: "neon_bar", activity: "socializing" },
                T09: { location: "neon_bar", activity: "drinking" },
                T10: { location: "resistance_hideout", activity: "sleeping" },
            },
            shopkeeper: {
                T01: { location: "neon_bar", activity: "closing" },
                T02: { location: "neon_bar", activity: "sleeping" },
                T03: { location: "neon_bar", activity: "sleeping" },
                T04: { location: "neon_bar", activity: "opening" },
                T05: { location: "neon_bar", activity: "working" },
                T06: { location: "neon_bar", activity: "working" },
                T07: { location: "neon_bar", activity: "working" },
                T08: { location: "neon_bar", activity: "peak_hours" },
                T09: { location: "neon_bar", activity: "peak_hours" },
                T10: { location: "neon_bar", activity: "closing" },
            },
            temple_guard: {
                T01: { location: "market", activity: "patrol" },
                T02: { location: "market", activity: "patrol" },
                T03: { location: "temple_plaza", activity: "shift_change" },
                T04: { location: "market", activity: "patrol" },
                T05: { location: "neon_bar", activity: "patrol" },
                T06: { location: "market", activity: "patrol" },
                T07: { location: "neon_bar", activity: "patrol" },
                T08: { location: "neon_bar", activity: "patrol" },
                T09: { location: "temple_plaza", activity: "off_duty" },
                T10: { location: "temple_plaza", activity: "sleeping" },
            },
            worker: {
                T01: { location: "resistance_hideout", activity: "sleeping" },
                T02: { location: "resistance_hideout", activity: "sleeping" },
                T03: { location: "market", activity: "commuting" },
                T04: { location: "market", activity: "working" },
                T05: { location: "market", activity: "working" },
                T06: { location: "market", activity: "working" },
                T07: { location: "neon_bar", activity: "leisure" },
                T08: { location: "neon_bar", activity: "drinking" },
                T09: { location: "market", activity: "commuting" },
                T10: { location: "resistance_hideout", activity: "sleeping" },
            },
            oracle: {
                T01: { location: "market", activity: "sleeping" },
                T02: { location: "market", activity: "meditation" },
                T03: { location: "market", activity: "visions" },
                T04: { location: "market", activity: "readings" },
                T05: { location: "market", activity: "readings" },
                T06: { location: "neon_bar", activity: "wandering" },
                T07: { location: "market", activity: "trading" },
                T08: { location: "neon_bar", activity: "socializing" },
                T09: { location: "market", activity: "visions" },
                T10: { location: "market", activity: "sleeping" },
            }
        };

        // =====================================================
        // SIMULATION STATE
        // =====================================================

        let state = {
            tick: 0,
            playing: true,
            speed: 50,
            zoom: 15,
            panX: 0,
            panY: 0,
            currentLocation: "neon_bar",
            viewMode: "building",
            selectedNPC: null,
            showLayers: {
                walls: true,
                furniture: true,
                npcs: true,
                objects: true,
                paths: false
            },
            npcStates: {}
        };

        // =====================================================
        // CANVAS SETUP
        // =====================================================

        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const container = document.getElementById("canvas-container");

        function resizeCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        resizeCanvas();
        window.addEventListener("resize", resizeCanvas);

        // =====================================================
        // TIME UTILITIES
        // =====================================================

        function getTimePeriod(tick) {
            const dayTick = tick % 240;
            if (dayTick < 24) return "T01";
            if (dayTick < 72) return "T02";
            if (dayTick < 120) return "T03";
            if (dayTick < 168) return "T04";
            if (dayTick < 192) return "T05";
            if (dayTick < 204) return "T06";
            if (dayTick < 216) return "T07";
            if (dayTick < 228) return "T08";
            if (dayTick < 236) return "T09";
            return "T10";
        }

        function getHour(tick) {
            return Math.floor((tick % 240) / 10);
        }

        function getDay(tick) {
            return Math.floor(tick / 240) + 1;
        }

        // =====================================================
        // NPC SIMULATION
        // =====================================================

        function hashString(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash = hash & hash;
            }
            return Math.abs(hash);
        }

        function getNPCState(npc, tick) {
            const timePeriod = getTimePeriod(tick);
            const schedule = SCHEDULES[npc.schedule] || SCHEDULES.worker;
            const slot = schedule[timePeriod] || { location: "market", activity: "idle" };

            // Get spawn point in location
            const location = LOCATIONS[slot.location] || LOCATIONS.neon_bar;
            const spawnPoints = location.spawnPoints || [{ x: 10, y: 10 }];

            // Deterministic position based on NPC and tick
            const hash = hashString(npc.id + "_" + Math.floor(tick / 5));
            const spawnIndex = hash % spawnPoints.length;
            const spawn = spawnPoints[spawnIndex];

            // Add some movement within area
            const moveHash = hashString(npc.id + "_move_" + tick);
            const offsetX = (moveHash % 5) - 2;
            const offsetY = ((moveHash >> 4) % 5) - 2;

            return {
                x: spawn.x + offsetX,
                y: spawn.y + offsetY,
                location: slot.location,
                activity: slot.activity,
                ...npc
            };
        }

        function updateNPCStates() {
            state.npcStates = {};
            NPCS.forEach(npc => {
                state.npcStates[npc.id] = getNPCState(npc, state.tick);
            });
        }

        // =====================================================
        // RENDERING
        // =====================================================

        function worldToScreen(x, y) {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            return {
                x: centerX + (x - state.panX) * state.zoom,
                y: centerY + (y - state.panY) * state.zoom
            };
        }

        function drawRect(x, y, w, h, color) {
            const screen = worldToScreen(x, y);
            ctx.fillStyle = color;
            ctx.fillRect(screen.x, screen.y, w * state.zoom, h * state.zoom);
        }

        function drawCircle(x, y, radius, color) {
            const screen = worldToScreen(x, y);
            ctx.beginPath();
            ctx.arc(screen.x, screen.y, radius * state.zoom, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
        }

        function drawLocation(location) {
            const loc = LOCATIONS[location];
            if (!loc) return;

            // Center on location
            state.panX = loc.width / 2;
            state.panY = loc.height / 2;

            // Draw floor
            drawRect(0, 0, loc.width, loc.height, "#1a1a25");

            // Draw grid
            ctx.strokeStyle = "#222";
            ctx.lineWidth = 1;
            for (let x = 0; x <= loc.width; x += 5) {
                const s1 = worldToScreen(x, 0);
                const s2 = worldToScreen(x, loc.height);
                ctx.beginPath();
                ctx.moveTo(s1.x, s1.y);
                ctx.lineTo(s2.x, s2.y);
                ctx.stroke();
            }
            for (let y = 0; y <= loc.height; y += 5) {
                const s1 = worldToScreen(0, y);
                const s2 = worldToScreen(loc.width, y);
                ctx.beginPath();
                ctx.moveTo(s1.x, s1.y);
                ctx.lineTo(s2.x, s2.y);
                ctx.stroke();
            }

            // Draw walls
            if (state.showLayers.walls) {
                loc.walls?.forEach(wall => {
                    drawRect(wall.x, wall.y, wall.w, wall.h, "#444");
                });
            }

            // Draw furniture
            if (state.showLayers.furniture) {
                const furnitureColors = {
                    stool: "#553300",
                    table: "#442200",
                    booth: "#553322",
                    couch: "#443322",
                    storage: "#333",
                    toilet: "#224444",
                    bed: "#334455",
                    rack: "#444",
                    tech: "#004444",
                    stall: "#443355"
                };
                loc.furniture?.forEach(f => {
                    drawRect(f.x, f.y, f.w, f.h, furnitureColors[f.type] || "#333");
                });
            }

            // Draw objects
            if (state.showLayers.objects) {
                loc.objects?.forEach(obj => {
                    drawCircle(obj.x + 0.5, obj.y + 0.5, 0.3, obj.color);
                });
            }

            // Draw doors
            loc.doors?.forEach(door => {
                drawRect(door.x, door.y, door.w, door.h, "#00CED1");
            });
        }

        function drawNPCs() {
            if (!state.showLayers.npcs) return;

            const npcsInLocation = [];

            Object.values(state.npcStates).forEach(npc => {
                if (npc.location === state.currentLocation) {
                    npcsInLocation.push(npc);

                    // Draw NPC dot
                    const isSelected = state.selectedNPC === npc.id;
                    const radius = isSelected ? 0.8 : 0.5;

                    // Glow effect for selected
                    if (isSelected) {
                        drawCircle(npc.x, npc.y, 1.2, "rgba(0, 206, 209, 0.3)");
                    }

                    drawCircle(npc.x, npc.y, radius, npc.color);

                    // Activity indicator
                    if (npc.activity === "sleeping") {
                        // Z's
                        const screen = worldToScreen(npc.x + 0.5, npc.y - 0.5);
                        ctx.fillStyle = "#888";
                        ctx.font = "10px monospace";
                        ctx.fillText("z", screen.x, screen.y);
                    }
                }
            });

            // Update NPC list
            document.getElementById("npc-count").textContent = npcsInLocation.length;
            const npcList = document.getElementById("npc-list");
            npcList.innerHTML = npcsInLocation.map(npc => `
                <div class="npc-item ${state.selectedNPC === npc.id ? 'selected' : ''}" 
                     onclick="selectNPC('${npc.id}')"
                     style="border-left: 3px solid ${npc.color};">
                    <strong>${npc.name}</strong><br>
                    ${npc.activity}
                </div>
            `).join("");
        }

        function draw() {
            // Clear
            ctx.fillStyle = "#0a0a0f";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw based on view mode
            if (state.viewMode === "building") {
                drawLocation(state.currentLocation);
                drawNPCs();
            } else if (state.viewMode === "district") {
                // Simplified district view
                drawDistrictView();
            } else if (state.viewMode === "city") {
                // City overview
                drawCityView();
            }

            // Draw location name
            const loc = LOCATIONS[state.currentLocation];
            if (loc) {
                ctx.fillStyle = "#00CED1";
                ctx.font = "14px monospace";
                ctx.fillText(loc.name, 10, canvas.height - 10);
            }
        }

        function drawDistrictView() {
            // Show multiple buildings
            const buildings = ["neon_bar", "resistance_hideout", "market"];
            let offsetX = -60;

            buildings.forEach((bldg, i) => {
                const loc = LOCATIONS[bldg];
                if (!loc) return;

                const x = offsetX + i * 30;
                const y = -20 + i * 15;

                // Draw building footprint
                drawRect(x, y, loc.width / 3, loc.height / 3, "#1a1a25");
                ctx.strokeStyle = "#00CED1";
                const screen = worldToScreen(x, y);
                ctx.strokeRect(screen.x, screen.y, loc.width / 3 * state.zoom, loc.height / 3 * state.zoom);

                // Draw NPC dots
                Object.values(state.npcStates).forEach(npc => {
                    if (npc.location === bldg) {
                        drawCircle(x + npc.x / 3, y + npc.y / 3, 0.3, npc.color);
                    }
                });

                // Label
                ctx.fillStyle = "#888";
                ctx.font = "10px monospace";
                ctx.fillText(loc.name, screen.x, screen.y - 5);
            });
        }

        function drawCityView() {
            // Abstract city map
            const districts = [
                { name: "Downtown", x: 0, y: 0, w: 30, h: 30, color: "#00CED1" },
                { name: "Industrial", x: 35, y: 0, w: 25, h: 20, color: "#FF6600" },
                { name: "Temple", x: 0, y: 35, w: 20, h: 25, color: "#FF4444" },
                { name: "Undercity", x: 25, y: 40, w: 35, h: 20, color: "#00FF00" },
            ];

            districts.forEach(d => {
                drawRect(d.x, d.y, d.w, d.h, "#1a1a25");
                ctx.strokeStyle = d.color;
                const screen = worldToScreen(d.x, d.y);
                ctx.strokeRect(screen.x, screen.y, d.w * state.zoom, d.h * state.zoom);

                // Label
                ctx.fillStyle = d.color;
                ctx.font = "12px monospace";
                ctx.fillText(d.name, screen.x + 5, screen.y + 15);
            });

            // Draw all NPCs as dots
            Object.values(state.npcStates).forEach(npc => {
                // Map location to district position
                const locMap = {
                    neon_bar: { x: 15, y: 15 },
                    resistance_hideout: { x: 30, y: 50 },
                    market: { x: 10, y: 20 },
                    temple_plaza: { x: 10, y: 45 }
                };
                const pos = locMap[npc.location] || { x: 30, y: 30 };
                const hash = hashString(npc.id);
                drawCircle(pos.x + (hash % 5), pos.y + ((hash >> 3) % 5), 0.4, npc.color);
            });
        }

        // =====================================================
        // CONTROLS
        // =====================================================

        // Play/Pause
        document.getElementById("play-btn").onclick = () => {
            state.playing = true;
            document.getElementById("play-btn").classList.add("active");
            document.getElementById("pause-btn").classList.remove("active");
        };

        document.getElementById("pause-btn").onclick = () => {
            state.playing = false;
            document.getElementById("play-btn").classList.remove("active");
            document.getElementById("pause-btn").classList.add("active");
        };

        document.getElementById("step-btn").onclick = () => {
            state.tick++;
            updateNPCStates();
        };

        // Speed
        document.getElementById("speed").oninput = (e) => {
            state.speed = e.target.value;
        };

        // View modes
        document.getElementById("view-building").onclick = () => {
            state.viewMode = "building";
            state.zoom = 15;
            document.querySelectorAll("#sidebar button").forEach(b => b.classList.remove("active"));
            document.getElementById("view-building").classList.add("active");
        };

        document.getElementById("view-district").onclick = () => {
            state.viewMode = "district";
            state.zoom = 8;
            state.panX = 0;
            state.panY = 0;
            document.querySelectorAll("#sidebar button").forEach(b => b.classList.remove("active"));
            document.getElementById("view-district").classList.add("active");
        };

        document.getElementById("view-city").onclick = () => {
            state.viewMode = "city";
            state.zoom = 6;
            state.panX = 30;
            state.panY = 30;
            document.querySelectorAll("#sidebar button").forEach(b => b.classList.remove("active"));
            document.getElementById("view-city").classList.add("active");
        };

        // Location select
        document.getElementById("location-select").onchange = (e) => {
            state.currentLocation = e.target.value;
        };

        // Layer toggles
        document.getElementById("show-walls").onchange = (e) => state.showLayers.walls = e.target.checked;
        document.getElementById("show-furniture").onchange = (e) => state.showLayers.furniture = e.target.checked;
        document.getElementById("show-npcs").onchange = (e) => state.showLayers.npcs = e.target.checked;
        document.getElementById("show-objects").onchange = (e) => state.showLayers.objects = e.target.checked;
        document.getElementById("show-paths").onchange = (e) => state.showLayers.paths = e.target.checked;

        // Zoom
        document.getElementById("zoom-in").onclick = () => state.zoom *= 1.2;
        document.getElementById("zoom-out").onclick = () => state.zoom /= 1.2;
        document.getElementById("zoom-reset").onclick = () => {
            state.zoom = 15;
            const loc = LOCATIONS[state.currentLocation];
            if (loc) {
                state.panX = loc.width / 2;
                state.panY = loc.height / 2;
            }
        };

        // Mouse wheel zoom
        canvas.addEventListener("wheel", (e) => {
            e.preventDefault();
            if (e.deltaY < 0) {
                state.zoom *= 1.1;
            } else {
                state.zoom /= 1.1;
            }
        });

        // Pan
        let isPanning = false;
        let lastMouse = { x: 0, y: 0 };

        canvas.addEventListener("mousedown", (e) => {
            isPanning = true;
            lastMouse = { x: e.clientX, y: e.clientY };
        });

        canvas.addEventListener("mousemove", (e) => {
            if (isPanning) {
                const dx = (e.clientX - lastMouse.x) / state.zoom;
                const dy = (e.clientY - lastMouse.y) / state.zoom;
                state.panX -= dx;
                state.panY -= dy;
                lastMouse = { x: e.clientX, y: e.clientY };
            }
        });

        canvas.addEventListener("mouseup", () => isPanning = false);
        canvas.addEventListener("mouseleave", () => isPanning = false);

        // NPC selection
        window.selectNPC = (id) => {
            state.selectedNPC = state.selectedNPC === id ? null : id;
        };

        // =====================================================
        // MAIN LOOP
        // =====================================================

        let lastUpdate = 0;

        function update(timestamp) {
            const delta = timestamp - lastUpdate;
            const interval = 1000 / (state.speed / 10 + 0.1);

            if (state.playing && delta > interval) {
                state.tick++;
                lastUpdate = timestamp;
            }

            updateNPCStates();

            // Update UI
            document.getElementById("tick-value").textContent = state.tick;
            document.getElementById("day-value").textContent = getDay(state.tick);
            document.getElementById("time-period").textContent = getTimePeriod(state.tick);
            document.getElementById("hour-value").textContent = getHour(state.tick);

            draw();
            requestAnimationFrame(update);
        }

        // Start
        updateNPCStates();
        requestAnimationFrame(update);
    </script>
</body>

</html>
